 <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Outbound Control — Fullers Logistics</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#060c17; --navy-950:#0a1729; --navy:#12233b; --navy-2:#1b3255;
    --ink:#101826; --paper:#eef1f5; --card:#fff; --line:#dbe2ea;
    --muted:#5c6b7d; --pass:#15803d; --pass-bg:#dcfce7; --fail:#dc2626; --fail-bg:#fee2e2;
    --na:#7a8494; --na-bg:#eceef1; --accent:#2f6fed; --amber:#b8710b; --amber-bg:#fdf1de;
    --live:#22d3ee;
    --stage-assigned:#64748b; --stage-staged:#2f6fed; --stage-ready:#d97706; --stage-dispatched:#16a34a;
    --font-display:'Space Grotesk',-apple-system,sans-serif;
    --font-body:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    --mono:'IBM Plex Mono','Consolas','SFMono-Regular',Menlo,monospace;
  }
  *{box-sizing:border-box;}
  body{margin:0; font-family:var(--font-body); background:var(--paper); color:var(--ink);}
  header.top{
    background:
      radial-gradient(ellipse 900px 300px at 15% -40%, rgba(47,111,237,.25), transparent),
      repeating-linear-gradient(-45deg, rgba(255,255,255,.025) 0 1px, transparent 1px 26px),
      linear-gradient(180deg, var(--void), var(--navy-950));
    color:#fff; padding:14px 24px; display:flex; align-items:center; justify-content:space-between;
    gap:14px; flex-wrap:wrap; position:sticky; top:0; z-index:60; box-shadow:0 4px 16px rgba(0,0,0,.28);
    border-bottom:1px solid rgba(255,255,255,.06);
  }
  .brand{display:flex; align-items:center; gap:11px;}
  .brand .mark{
    width:36px; height:36px; border-radius:9px; flex:none;
    background:linear-gradient(135deg,#2f6fed,#1b3255);
    display:flex; align-items:center; justify-content:center;
    font-family:var(--font-display); font-weight:700; font-size:14px; color:#fff;
    box-shadow:0 2px 8px rgba(47,111,237,.4), inset 0 1px 0 rgba(255,255,255,.2);
  }
  header.top .brand .t1{font-family:var(--font-display); font-size:17px; font-weight:600; letter-spacing:.3px;}
  header.top .brand .t2{font-size:11px; color:#8296b3; font-family:var(--mono); letter-spacing:.2px; margin-top:1px;}
  .hdr-right{display:flex; align-items:center; gap:14px; flex-wrap:wrap;}
  .clock{display:flex; align-items:center; gap:8px; padding-right:14px; border-right:1px solid rgba(255,255,255,.12); font-family:var(--mono);}
  .clock .live-dot{width:7px; height:7px; border-radius:50%; background:var(--live); flex:none; animation:livePulse 2s ease-in-out infinite;}
  .clock .time{font-size:13.5px; font-weight:600; letter-spacing:.5px; font-variant-numeric:tabular-nums;}
  .clock .date{font-size:10px; color:#8296b3; letter-spacing:.3px;}
  @keyframes livePulse{
    0%, 100% { box-shadow:0 0 0 0 rgba(34,211,238,.6); }
    50% { box-shadow:0 0 0 5px rgba(34,211,238,0); }
  }
  .who{display:flex; align-items:center; gap:6px; font-size:12px; color:#aab8cc;}
  .who input{padding:6px 8px; border-radius:5px; border:1px solid rgba(255,255,255,.16); background:rgba(255,255,255,.06); color:#fff; font-size:12.5px; width:120px; font-family:var(--font-body);}
  .who input::placeholder{color:#728098;}
  .tabs{display:flex; gap:4px;}
  .tabs button{background:transparent; border:1px solid rgba(255,255,255,.16); color:#c3cfe3; padding:7px 12px; border-radius:6px; font-size:12.5px; font-weight:600; cursor:pointer; font-family:var(--font-body); transition:.15s;}
  .tabs button:hover{border-color:rgba(255,255,255,.35); color:#fff;}
  .tabs button.active{background:#fff; color:var(--navy); border-color:#fff;}
  .btn{padding:8px 15px; border-radius:6px; font-size:12.5px; font-weight:600; cursor:pointer; border:1px solid transparent; font-family:var(--font-body); transition:.15s;}
  .btn.primary{background:linear-gradient(135deg,#3b7cf7,#2f6fed); color:#fff; box-shadow:0 2px 6px rgba(47,111,237,.35);}
  .btn.primary:hover{background:#1e5adb; transform:translateY(-1px); box-shadow:0 4px 10px rgba(47,111,237,.45);}
  .btn.ghost{background:#fff; border-color:var(--line); color:var(--ink);}
  .btn.ghost:hover{background:#f0f2f5;}
  .btn.danger{background:#fff; border-color:var(--fail); color:var(--fail);}
  .btn.sm{padding:5px 10px; font-size:11.5px;}

  .summary{
    display:flex; padding:14px 24px; flex-wrap:wrap; background:var(--navy-950); border-bottom:1px solid rgba(255,255,255,.06);
  }
  .sumcard{flex:1; min-width:120px; padding:0 20px; border-right:1px solid rgba(255,255,255,.09);}
  .sumcard:last-child{border-right:none;}
  .sumcard .n{font-family:var(--mono); font-size:24px; font-weight:600; font-variant-numeric:tabular-nums; color:#fff; letter-spacing:.2px;}
  .sumcard .l{font-size:10px; text-transform:uppercase; letter-spacing:.6px; color:#8296b3; font-weight:600; margin-top:2px;}
  .sumcard.overdue .n, .sumcard.overdue .l{color:#ff6b6b;}
  .sumcard .n.dot::after{content:''; display:inline-block; width:6px; height:6px; border-radius:50%; background:#ff6b6b; margin-left:8px; vertical-align:middle; animation:livePulse 1.6s ease-in-out infinite;}

  #view-board{padding:20px 24px 60px;}
  .board{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; align-items:start;}
  @media (max-width:1100px){.board{grid-template-columns:repeat(2,1fr);}}
  .col{background:#e7eaef; border-radius:12px; padding:12px; min-height:120px; border-top:3px solid var(--stage-color, var(--line));}
  .col-progress{height:4px; background:rgba(15,23,42,.08); border-radius:2px; overflow:hidden; margin:0 0 10px;}
  .col-progress-fill{height:100%; background:var(--stage-color, var(--accent)); border-radius:2px; transition:width .4s ease;}
  .col h3{margin:0 0 10px; font-family:var(--font-display); font-size:12px; text-transform:uppercase; letter-spacing:.4px; color:var(--navy); display:flex; justify-content:space-between; align-items:center; font-weight:600;}
  .col h3 .cnt{background:var(--stage-color, var(--navy)); color:#fff; border-radius:10px; padding:1px 9px; font-size:11px; font-family:var(--mono);}
  .card{background:#fff; border:1px solid var(--line); border-left:3px solid var(--stage-color, var(--line)); border-radius:10px; padding:11px 12px; margin-bottom:9px; cursor:pointer; box-shadow:0 1px 2px rgba(15,23,42,.05); transition:.15s;}
  .card:hover{border-color:var(--accent); border-left-color:var(--stage-color, var(--accent)); transform:translateY(-1px); box-shadow:0 4px 10px rgba(15,23,42,.09);}
  .card.urgent{border-left:3px solid var(--amber); box-shadow:0 0 0 1px rgba(184,113,11,.25);}
  .card.overdue{
    border-left:3px solid #7a0000;
    background:#e02020;
    animation:overduePulse 1.6s ease-in-out infinite;
  }
  .card.overdue .ord, .card.overdue .cust, .card.overdue .assigned{color:#fff;}
  .card.overdue .cust, .card.overdue .assigned{color:#ffe1e1;}
  .badge.overdue{background:#fff; color:#c40000; border:1px solid #c40000;}
  @keyframes overduePulse{
    0%, 100% { box-shadow:0 0 0 0 rgba(224,32,32,.55); }
    50% { box-shadow:0 0 0 6px rgba(224,32,32,0); }
  }
  .card .ord{font-family:var(--mono); font-weight:600; font-size:13px; letter-spacing:.2px;}
  .card .cust{font-size:12.5px; color:var(--muted); margin-top:2px; font-weight:500;}
  .card .meta{display:flex; flex-wrap:wrap; gap:5px; margin-top:8px;}
  .badge{font-size:10px; font-weight:700; padding:3px 8px; border-radius:20px; background:var(--na-bg); color:var(--na); font-family:var(--mono); letter-spacing:.2px;}
  .badge.time{background:#e6edfb; color:var(--accent);}
  .badge.urgent{background:var(--amber-bg); color:var(--amber); font-family:var(--font-body);}
  .badge.hold{background:var(--fail-bg); color:var(--fail); font-family:var(--font-body);}
  .card .assigned{font-size:11px; color:var(--muted); margin-top:7px; font-family:var(--mono);}

  .empty-col{font-size:11.5px; color:#8b96a3; padding:14px 6px; text-align:center; font-style:italic;}

  /* Modal */
  .overlay{position:fixed; inset:0; background:rgba(6,12,23,.6); backdrop-filter:blur(2px); display:none; align-items:flex-start; justify-content:center; z-index:100; padding:30px 16px; overflow-y:auto;}
  .overlay.open{display:flex;}
  .modal{
    background:#fff; border-radius:12px; max-width:820px; width:100%; overflow:hidden;
    box-shadow:0 20px 50px rgba(6,12,23,.35);
    opacity:0; transform:translateY(10px) scale(.98); transition:opacity .18s ease, transform .18s ease;
  }
  .overlay.open .modal{opacity:1; transform:translateY(0) scale(1);}
  .modal-head{
    background:linear-gradient(135deg, var(--navy-950), var(--navy-2)); color:#fff; padding:16px 20px;
    display:flex; justify-content:space-between; align-items:center;
  }
  .modal-head .ttl{font-family:var(--font-display); font-size:16px; font-weight:600;}
  .modal-head .sub{font-size:11px; color:#8296b3; font-family:var(--mono); margin-top:3px; letter-spacing:.2px;}
  .modal-head button{background:rgba(255,255,255,.12); border:none; color:#fff; width:28px; height:28px; border-radius:7px; cursor:pointer; font-size:15px; transition:.15s;}
  .modal-head button:hover{background:rgba(255,255,255,.22);}
  .modal-body{padding:20px; max-height:75vh; overflow-y:auto;}
  .section{margin-bottom:20px;}
  .section h4{font-family:var(--font-display); font-size:11.5px; text-transform:uppercase; letter-spacing:.4px; color:var(--muted); margin:0 0 10px; border-bottom:1px solid var(--line); padding-bottom:7px; font-weight:600;}
  .role-tag{display:inline-block; margin-left:8px; padding:2px 8px; border-radius:10px; background:var(--accent); color:#fff; font-size:9.5px; font-weight:700; text-transform:uppercase; letter-spacing:.3px; vertical-align:middle;}
  .grid{display:grid; grid-template-columns:repeat(3,1fr); gap:10px;}
  @media (max-width:640px){.grid{grid-template-columns:1fr 1fr;}}
  .field label{display:block; font-size:10.5px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.3px; margin-bottom:3px;}
  .field input, .field select, .field textarea{width:100%; padding:7px 8px; border:1px solid var(--line); border-radius:5px; font-size:13px; font-family:inherit; background:#fbfcfd;}
  .field input:focus, .field select:focus, .field textarea:focus{outline:2px solid var(--accent); outline-offset:1px; background:#fff;}
  .dup-warning{margin-top:8px; padding:8px 10px; background:var(--fail-bg); color:var(--fail); border-radius:6px; font-size:12px; font-weight:600;}

  table.checks{width:100%; border-collapse:collapse; font-size:12.5px;}
  table.checks th{text-align:left; font-size:10px; text-transform:uppercase; color:var(--muted); border-bottom:1px solid var(--line); padding:5px 6px;}
  table.checks td{padding:6px; border-bottom:1px solid #eef1f4; vertical-align:top;}
  .chk-label{font-weight:700;}
  .chk-req{font-size:10.5px; color:var(--muted);}
  .seg{display:flex; gap:3px;}
  .seg button{border:1px solid var(--line); background:#fff; padding:4px 8px; font-size:10.5px; font-weight:700; cursor:pointer; border-radius:5px; color:var(--muted);}
  .seg button[data-v="PASS"].active{background:var(--pass-bg); color:var(--pass); border-color:var(--pass);}
  .seg button[data-v="FAIL"].active{background:var(--fail-bg); color:var(--fail); border-color:var(--fail);}
  .seg button[data-v="N/A"].active{background:var(--na-bg); color:var(--na); border-color:var(--na);}

  .photo-grid{display:flex; flex-wrap:wrap; gap:8px; margin-top:8px;}
  .photo-grid img{width:84px; height:84px; object-fit:cover; border-radius:6px; border:1px solid var(--line); cursor:pointer;}
  .photo-add{border:1px dashed var(--line); border-radius:6px; width:84px; height:84px; display:flex; align-items:center; justify-content:center; color:var(--muted); font-size:26px; cursor:pointer; background:#fbfcfd; transition:.15s;}
  .photo-add:hover{border-color:var(--accent); background:#eef3ff;}
  .photo-alt{margin-top:8px; font-size:11.5px; color:var(--muted);}
  .linklike{color:var(--accent); cursor:pointer; text-decoration:underline;}

  /* In-page camera capture */
  .cam-overlay{position:fixed; inset:0; background:#000; z-index:300; display:none; flex-direction:column;}
  .cam-overlay.open{display:flex;}
  .cam-top{display:flex; justify-content:space-between; align-items:center; padding:14px 18px; color:#fff; background:rgba(0,0,0,.45); flex:none;}
  .cam-title{font-size:13px; font-weight:600; font-family:var(--font-body);}
  .cam-close{background:rgba(255,255,255,.15); border:none; color:#fff; padding:8px 14px; border-radius:7px; font-size:12.5px; font-weight:600; cursor:pointer; font-family:var(--font-body);}
  .cam-close:hover{background:rgba(255,255,255,.28);}
  .cam-stage{flex:1; position:relative; display:flex; align-items:center; justify-content:center; overflow:hidden; background:#000;}
  .cam-stage video{max-width:100%; max-height:100%; object-fit:contain;}
  .cam-flash{position:absolute; inset:0; background:#fff; opacity:0; pointer-events:none;}
  .cam-flash.flash{animation:camFlash .25s ease;}
  @keyframes camFlash{0%{opacity:.85;} 100%{opacity:0;}}
  .cam-error{position:absolute; inset:0; display:none; align-items:center; justify-content:center; color:#fff; text-align:center; padding:30px; font-size:13.5px; background:rgba(0,0,0,.7); line-height:1.5;}
  .cam-controls{display:flex; align-items:center; justify-content:center; gap:20px; padding:18px; background:rgba(0,0,0,.45); flex:none;}
  .cam-count{color:#fff; font-size:12px; font-family:var(--mono); min-width:90px;}
  .cam-shutter{width:64px; height:64px; border-radius:50%; background:#fff; border:4px solid rgba(255,255,255,.35); cursor:pointer; flex:none;}
  .cam-shutter:active{transform:scale(.92);}
  .cam-thumbs{display:flex; gap:6px; min-width:96px; max-width:200px; overflow-x:auto;}
  .cam-thumbs img{width:40px; height:40px; object-fit:cover; border-radius:4px; border:1px solid rgba(255,255,255,.35); flex:none;}

  .log{max-height:180px; overflow-y:auto; border:1px solid var(--line); border-radius:6px; padding:8px; font-size:12px; background:#fbfcfd;}
  .log-entry{padding:5px 0; border-bottom:1px solid #eef1f4;}
  .log-entry:last-child{border-bottom:none;}
  .log-entry .who{font-weight:700;}
  .log-entry .when{color:var(--muted); font-size:10.5px; float:right;}
  .add-note{display:flex; gap:6px; margin-top:8px;}
  .add-note input{flex:1;}

  .modal-actions{padding:14px 18px; border-top:1px solid var(--line); display:flex; gap:8px; flex-wrap:wrap; justify-content:space-between;}
  .modal-actions .left{display:flex; gap:8px; flex-wrap:wrap;}

  /* History */
  #view-history{padding:16px 20px 60px;}
  .hist-card{background:#fff; border:1px solid var(--line); border-radius:8px; padding:16px; margin-bottom:14px;}
  .logsearch{width:100%; padding:9px 10px; border:1px solid var(--line); border-radius:6px; font-size:13.5px; margin-bottom:14px;}
  table.hist{width:100%; border-collapse:collapse; font-size:12.5px;}
  table.hist th{text-align:left; padding:8px; background:#f0f2f5; border-bottom:1px solid var(--line); font-size:10.5px; text-transform:uppercase; color:var(--muted);}
  table.hist td{padding:8px; border-bottom:1px solid #eef1f4;}
  table.hist tr:hover{background:#f8f9fb; cursor:pointer;}
  .empty{padding:44px; text-align:center; color:var(--muted); font-size:13.5px;}
  .subtabs{display:flex; gap:6px; margin-bottom:14px;}
  .subtabs button{background:#fff; border:1px solid var(--line); color:var(--muted); padding:7px 14px; border-radius:6px; font-size:12.5px; font-weight:600; cursor:pointer; font-family:var(--font-body); transition:.15s;}
  .subtabs button.active{background:var(--navy-950); color:#fff; border-color:var(--navy-950);}

  #view-board, #view-history{display:none;}
  #view-board.active, #view-history.active{display:block;}

  /* Wall Board mode */
  .dev-banner{
    background:#fdf3c7; color:#7a5b00; text-align:center; font-size:12px; font-weight:700;
    padding:6px 12px; letter-spacing:.2px; border-bottom:1px solid #e8cf6b;
  }
  body.wallboard .dev-banner{display:none;}
  .wallboard-exit{
    display:none; position:fixed; top:18px; right:18px; z-index:200;
    background:rgba(6,12,23,.75); color:#fff; border:1px solid rgba(255,255,255,.25);
    padding:10px 16px; border-radius:8px; font-size:12.5px; font-weight:600; cursor:pointer;
    font-family:var(--font-body); backdrop-filter:blur(4px);
  }
  .wallboard-exit:hover{background:rgba(6,12,23,.92);}
  body.wallboard .wallboard-exit{display:block;}
  body.wallboard .hdr-right > *:not(.clock){display:none;}
  body.wallboard .card{cursor:default; pointer-events:none;}
  body.wallboard header.top{padding:22px 44px;}
  body.wallboard .brand .mark{width:48px; height:48px; font-size:18px; border-radius:11px;}
  body.wallboard .brand .t1{font-size:24px; letter-spacing:.5px;}
  body.wallboard .brand .t2{font-size:12.5px;}
  body.wallboard .clock{padding-right:0; border-right:none;}
  body.wallboard .clock .time{font-size:22px;}
  body.wallboard .clock .date{font-size:12px;}
  body.wallboard .summary{padding:20px 44px;}
  body.wallboard .sumcard .n{font-size:36px;}
  body.wallboard .sumcard .l{font-size:11.5px;}
  body.wallboard #view-board{padding:26px 44px 50px;}
  body.wallboard .board{gap:18px;}
  body.wallboard .col h3{font-size:14px;}
  body.wallboard .card{padding:16px 18px; margin-bottom:12px;}
  body.wallboard .card .ord{font-size:16px;}
  body.wallboard .card .cust{font-size:14px;}
  body.wallboard .badge{font-size:11.5px; padding:4px 10px;}
  body.wallboard .card .assigned{font-size:12.5px;}

  /* Board toolbar (search) */
  .board-toolbar{margin-bottom:14px;}
  .board-toolbar input{width:100%; max-width:420px; padding:9px 12px; border:1px solid var(--line); border-radius:7px; font-size:13px; background:#fff;}
  body.wallboard .board-toolbar{display:none;}

  /* Backup / restore buttons */
  .backup-buttons{display:flex; gap:6px;}

  /* Printable collection note */
  .print-note-area{display:none;}
  @media print{
    body.print-note-mode > *:not(#printNoteArea){display:none !important;}
    body.print-note-mode #printNoteArea{display:block !important;}
    .note-block{font-family:Arial, sans-serif; color:#000; padding:10px;}
    .note-h1{font-size:18px; font-weight:800; margin-bottom:2px;}
    .note-sub{font-size:11px; color:#444; margin-bottom:16px; font-family:monospace;}
    .note-table{width:100%; border-collapse:collapse; margin-bottom:16px;}
    .note-table td{padding:6px 8px; border:1px solid #999; font-size:12.5px;}
    .note-table td:first-child{font-weight:700; width:220px; background:#f0f0f0;}
    .note-notes{font-size:12.5px; margin-bottom:22px;}
    .note-sign div{margin-bottom:18px; font-size:12.5px;}
  }
</style>
</head>
<body>

<header class="top">
  <div class="brand">
    <div class="mark">FL</div>
    <div>
      <div class="t1">OUTBOUND CONTROL</div>
      <div class="t2">Fullers Logistics · SOP-OUT-PAL-001</div>
    </div>
  </div>
  <div class="hdr-right">
    <div class="clock">
      <span class="live-dot"></span>
      <div>
        <div class="time" id="clockTime">--:--:--</div>
        <div class="date" id="clockDate">—</div>
      </div>
    </div>
    <div class="who">
      <span>You:</span>
      <input id="whoami" placeholder="Your name" onchange="saveWhoami()">
    </div>
    <div class="tabs">
      <button id="tabBoardBtn" class="active" onclick="showView('board')">Board</button>
      <button id="tabHistBtn" onclick="showView('history')">History</button>
    </div>
    <div class="backup-buttons">
      <button class="btn ghost" onclick="exportBackup()" title="Download all orders as a backup file">⬇ Backup</button>
      <button class="btn ghost" onclick="document.getElementById('restoreFileInput').click()" title="Restore orders from a backup file">⬆ Restore</button>
      <input type="file" id="restoreFileInput" accept="application/json" style="display:none;" onchange="importBackup(event)">
      <button class="btn ghost" onclick="setManagerPin()" title="Set/change the manager override PIN">🔑 PIN</button>
    </div>
    <button class="btn ghost" onclick="enterWallBoard()">⛶ Wall Board</button>
    <button class="btn ghost" onclick="openReportPanel()" title="Report an idea or issue to IT/Admin">💬 Report</button>
    <button class="btn primary" onclick="openNewOrder()">+ New Order</button>
  </div>
</header>

<div class="dev-banner">⚠ This site is still in development — some features may not work as expected yet.</div>

<button class="wallboard-exit" onclick="exitWallBoard()">✕ Exit Wall Board</button>

<div class="summary" id="summaryBar"></div>

<main id="view-board" class="active">
  <div class="board-toolbar">
    <input id="boardSearch" placeholder="Filter board by customer, order no., carrier or driver…" oninput="renderBoard()">
  </div>
  <div class="board" id="boardGrid"></div>
</main>

<main id="view-history">

<script>
const STAGES = [
  {id:'assigned', label:'Pick / Rack Pull', next:'staged', nextLabel:'Mark Staged'},
  {id:'staged', label:'Staged & Checked', next:'ready', nextLabel:'Mark Ready for Collection'},
  {id:'ready', label:'Ready for Collection', next:'dispatched', nextLabel:'Mark Dispatched'},
  {id:'dispatched', label:'Dispatched', next:null, nextLabel:null},
];

const CHECK_ROWS = [
  {k:'c_orderMatch', label:'Customer / Order', req:'Matches system & documentation.'},
  {k:'c_pallet', label:'Pallet & Load', req:'Sound pallet, stable load, wrapped/secured.'},
  {k:'c_label', label:'Labels / SSCC', req:'Correct, legible, scannable where required.'},
  {k:'c_docs', label:'Documentation', req:'Dispatch paperwork complete and matches system.'},
  {k:'c_recon', label:'Pallet Reconciliation', req:'Expected, physical & documented counts agree.'},
  {k:'c_vehicle', label:'Vehicle & Driver', req:'Correct carrier, vehicle and driver verified.'},
  {k:'c_importerLabels', label:'Awaiting Importer Labels', req:'Importer labels received and applied — must not be outstanding before release.', naAllowed:true},
  {k:'c_dgNotes', label:'Awaiting Dangerous Goods Notes', req:'Dangerous goods documentation received — must not be outstanding before release.', naAllowed:true},
];

const WHOAMI_KEY = 'oot_whoami_v1';
const PIN_KEY = 'oot_manager_pin_v1';

// ── Supabase config ──────────────────────────────────────────────────────
// Paste your project's values here (Supabase dashboard → Project Settings → API).
// The anon key is meant to be public/embedded in client code — that's how Supabase
// is designed to work — access is controlled by the Row Level Security policies
// set up in the schema, not by hiding this key.
const SUPABASE_URL = 'https://ybuqcgtmclejhejftzhy.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_B7j-97BQTNgg32-eqBLk3w_szPX6qCW';
const sb = (SUPABASE_URL.startsWith('http') && window.supabase)
  ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
  : null;
// ─────────────────────────────────────────────────────────────────────────

function getManagerPin(){ return localStorage.getItem(PIN_KEY) || '2468'; }
function setManagerPin(){
  const current = prompt('Enter the current manager PIN to change it:');
  if (current === null) return;
  if (current !== getManagerPin()){ alert('Incorrect PIN.'); return; }
  const next = prompt('Enter the new manager PIN:');
  if (next === null || !next.trim()) return;
  const confirmNext = prompt('Re-enter the new manager PIN to confirm:');
  if (confirmNext === null) return;
  if (confirmNext.trim() !== next.trim()){ alert('PINs did not match — no change made.'); return; }
  localStorage.setItem(PIN_KEY, next.trim());
  alert('Manager PIN updated.');
}

let orders = [];
let reports = [];
let activeOrderId = null;

async function fetchOrdersFromServer(){
  if (!sb) return [];
  const { data, error } = await sb.from('oot_orders').select('data');
  if (error){ console.error('Load orders failed:', error); return []; }
  const arr = data.map(row => row.data);
  backfillOrders(arr);
  return arr;
}
function backfillOrders(arr){
  arr.forEach(o => {
    if (!o.checks) o.checks = {};
    CHECK_ROWS.forEach(r => { if (!o.checks[r.k]) o.checks[r.k] = {status:null, comment:''}; });
    if (!o.stageEnteredAt) o.stageEnteredAt = o.createdAt || new Date().toISOString();
    if (!o.stageStamps) o.stageStamps = {};
  });
}
let recentlySavedUntil = {}; // orderId -> timestamp until which incoming realtime echoes are ignored

function persistOrders(){
  if (!sb) return;
  const suppressUntil = Date.now() + 4000;
  orders.forEach(o => { recentlySavedUntil[o.id] = suppressUntil; });
  const rows = orders.map(o => ({ id: o.id, data: o, updated_at: new Date().toISOString() }));
  if (!rows.length) return;
  sb.from('oot_orders').upsert(rows, { onConflict: 'id' }).then(({error}) => {
    if (error) console.error('Save order failed:', error);
  });
}
async function nextOrderRef(){
  if (!sb) return 'OOT-' + Date.now();
  const { data, error } = await sb.rpc('next_order_id');
  if (error){ console.error('Could not generate order ID:', error); return 'OOT-' + Date.now(); }
  return data;
}
function whoami(){ return document.getElementById('whoami').value.trim() || 'Unknown'; }
function saveWhoami(){ localStorage.setItem(WHOAMI_KEY, document.getElementById('whoami').value); }

async function blankOrder(){
  const now = new Date().toISOString();
  const id = await nextOrderRef();
  const o = {
    id, createdAt: now, stage:'assigned', priority:'normal', stageEnteredAt: now,
    customer:'', orderNo:'', destination:'', carrier:'', collectionRef:'', requestedCollection:'',
    csNotes:'', loggedBy:'',
    expectedPallets:'', physicalPallets:'', palletLocation:'', vehicleReg:'', driver:'',
    checks:{}, photos:[], activity:[], dispatchedAt:null,
    deleted:false, deletedAt:null, deletedBy:null, deleteReason:'',
    stageStamps:{},
  };
  CHECK_ROWS.forEach(r => o.checks[r.k] = {status:null, comment:''});
  return o;
}

function formatDuration(ms){
  if (ms < 0) ms = 0;
  const mins = Math.floor(ms / 60000);
  const h = Math.floor(mins / 60);
  const m = mins % 60;
  if (h <= 0) return `${m}m`;
  return `${h}h ${m}m`;
}

function logActivity(o, action, note){
  o.activity.push({at:new Date().toISOString(), by:whoami(), action, note: note||''});
}

function isOverdue(o){
  if (o.deleted || !o.requestedCollection || o.stage === 'dispatched') return false;
  return new Date(o.requestedCollection).getTime() < Date.now();
}
function hasFail(o){ return Object.values(o.checks).some(c => c.status === 'FAIL'); }

function isToday(iso){
  if (!iso) return false;
  const d = new Date(iso), now = new Date();
  return d.getFullYear()===now.getFullYear() && d.getMonth()===now.getMonth() && d.getDate()===now.getDate();
}

function renderSummary(){
  const counts = {};
  STAGES.forEach(s => counts[s.id] = 0);
  let overdue = 0, dispatchedToday = 0;
  orders.forEach(o => {
    if (o.deleted) return;
    counts[o.stage] = (counts[o.stage]||0) + 1;
    if (isOverdue(o)) overdue++;
    if (o.stage === 'dispatched' && isToday(o.dispatchedAt)) dispatchedToday++;
  });
  const wrap = document.getElementById('summaryBar');
  wrap.innerHTML = STAGES.map(s => `
    <div class="sumcard"><div class="n">${counts[s.id]||0}</div><div class="l">${s.label}</div></div>
  `).join('')
    + `<div class="sumcard"><div class="n">${dispatchedToday}</div><div class="l">Dispatched Today</div></div>`
    + `<div class="sumcard overdue"><div class="n${overdue>0?' dot':''}">${overdue}</div><div class="l">Overdue Collection</div></div>`;
}

function renderBoard(){
  const grid = document.getElementById('boardGrid');
  const searchEl = document.getElementById('boardSearch');
  const q = (searchEl && searchEl.value || '').toLowerCase();
  const stageItemsAll = STAGES.map(stage => orders.filter(o => o.stage === stage.id && !o.deleted));
  const maxCount = Math.max(1, ...stageItemsAll.map(items => items.length));
  grid.innerHTML = STAGES.map((stage, idx) => {
    const items = stageItemsAll[idx]
      .filter(o => !q || [o.customer,o.orderNo,o.carrier,o.driver].join(' ').toLowerCase().includes(q))
      .sort((a,b) => (a.requestedCollection||'').localeCompare(b.requestedCollection||''));
    const pct = Math.round((stageItemsAll[idx].length / maxCount) * 100);
    return `
      <div class="col" style="--stage-color:var(--stage-${stage.id})">
        <h3>${stage.label} <span class="cnt">${items.length}</span></h3>
        <div class="col-progress"><div class="col-progress-fill" style="width:${pct}%"></div></div>
        ${items.length ? items.map(o => cardHtml(o)).join('') : '<div class="empty-col">Nothing here</div>'}
      </div>`;
  }).join('');
}

function cardHtml(o){
  const overdue = isOverdue(o);
  const cls = ['card'];
  if (o.priority === 'urgent') cls.push('urgent');
  if (overdue) cls.push('overdue');
  const timeBadge = o.requestedCollection
    ? `<span class="badge ${overdue?'overdue':'time'}">${overdue?'OVERDUE ':''}${new Date(o.requestedCollection).toLocaleString([], {day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})}</span>` : '';
  return `
    <div class="${cls.join(' ')}" onclick="openOrder('${o.id}')">
      <div class="ord">${o.orderNo || '(no order no.)'} <span style="font-weight:400;color:var(--muted);font-size:11px;">${o.id}</span></div>
      <div class="cust">${o.customer || '—'} · ${o.carrier || '—'}</div>
      <div class="meta">
        ${timeBadge}
        ${(o.physicalPallets || o.expectedPallets) ? `<span class="badge">Pallets: ${o.physicalPallets || o.expectedPallets}</span>` : ''}
        ${o.priority === 'urgent' ? '<span class="badge urgent">URGENT</span>' : ''}
        ${hasFail(o) ? '<span class="badge hold">HOLD</span>' : ''}
        ${o.photos.length ? `<span class="badge">${o.photos.length} photo${o.photos.length>1?'s':''}</span>` : ''}
      </div>
      ${o.palletLocation ? `<div class="assigned">Location: ${o.palletLocation}</div>` : ''}
      <div class="assigned">In stage: ${formatDuration(Date.now() - new Date(o.stageEnteredAt || o.createdAt).getTime())}</div>
    </div>`;
}

async function openNewOrder(){
  const o = await blankOrder();
  o.loggedBy = whoami();
  o.stageStamps.assigned = {by: whoami(), at: o.createdAt};
  logActivity(o, 'Order flagged', 'Logged by Customer Service');
  orders.push(o);
  persistOrders();
  renderAll();
  openOrder(o.id);
}

function openOrder(id){
  activeOrderId = id;
  renderModal();
  document.getElementById('overlay').classList.add('open');
}
function closeModal(){
  document.getElementById('overlay').classList.remove('open');
  activeOrderId = null;
  renderAll();
}

function loadReports(){ return reports; }
function persistReports(list){
  reports = list;
  if (!sb) return;
  const rows = list.map(r => ({ id: r.id, data: r, updated_at: new Date().toISOString() }));
  if (!rows.length) return;
  sb.from('oot_reports').upsert(rows, { onConflict: 'id' }).then(({error}) => {
    if (error) console.error('Save report failed:', error);
  });
}
async function fetchReportsFromServer(){
  if (!sb) return [];
  const { data, error } = await sb.from('oot_reports').select('data');
  if (error){ console.error('Load reports failed:', error); return []; }
  return data.map(row => row.data);
}

function openReportPanel(){
  renderReportPanel();
  document.getElementById('reportOverlay').classList.add('open');
}
function closeReportPanel(){
  document.getElementById('reportOverlay').classList.remove('open');
}

function renderReportPanel(){
  const reports = loadReports().slice().reverse();
  const modal = document.getElementById('reportModal');
  modal.innerHTML = `
    <div class="modal-head">
      <div>
        <div class="ttl">Report an Idea or Issue</div>
        <div class="sub">Goes to IT/Admin for review — not a live support chat</div>
      </div>
      <button onclick="closeReportPanel()">✕</button>
    </div>
    <div class="modal-body">
      <div class="section">
        <h4>New Report</h4>
        <div class="grid">
          <div class="field"><label>Your Name</label><input id="repName" value="${whoami() !== 'Unknown' ? whoami() : ''}"></div>
          <div class="field"><label>Type</label>
            <select id="repType">
              <option value="Idea">Idea / Suggestion</option>
              <option value="Issue">Issue / Bug</option>
              <option value="Other">Other</option>
            </select>
          </div>
        </div>
        <div class="field" style="margin-top:10px;"><label>What's on your mind?</label>
          <textarea id="repMessage" rows="3" placeholder="Describe the idea or issue…"></textarea>
        </div>
        <div style="margin-top:10px;"><button class="btn primary sm" onclick="submitReport()">Submit Report</button></div>
      </div>
      <div class="section">
        <h4>Submitted Reports <span style="font-weight:400; text-transform:none; letter-spacing:0;">(${reports.length})</span></h4>
        ${reports.length ? `
          <div class="log" style="max-height:300px;">
            ${reports.map(r => `
              <div class="log-entry">
                <span class="when">${new Date(r.at).toLocaleString([], {day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})}</span>
                <span class="who">${r.by || 'Unknown'}</span> — <strong>${r.type}</strong>: ${(r.message||'').replace(/</g,'&lt;')}
                <div style="margin-top:4px;">
                  <span class="badge ${r.status==='resolved' ? '' : 'urgent'}">${r.status === 'resolved' ? 'Reviewed' : 'Open'}</span>
                  <span class="linklike" style="margin-left:8px;" onclick="toggleReportStatus('${r.id}')">${r.status === 'resolved' ? 'Mark as open' : 'Mark as reviewed'}</span>
                </div>
              </div>
            `).join('')}
          </div>
        ` : '<div class="empty-col">No reports submitted yet.</div>'}
      </div>
    </div>
  `;
}

function submitReport(){
  const name = document.getElementById('repName').value.trim() || whoami();
  const type = document.getElementById('repType').value;
  const message = document.getElementById('repMessage').value.trim();
  if (!message){ alert('Please add a short description before submitting.'); return; }
  const reports = loadReports();
  reports.push({id: 'REP-' + Date.now(), by: name, type, message, at: new Date().toISOString(), status: 'open'});
  persistReports(reports);
  renderReportPanel();
}

function toggleReportStatus(id){
  const reports = loadReports();
  const r = reports.find(x => x.id === id);
  if (!r) return;
  r.status = r.status === 'resolved' ? 'open' : 'resolved';
  persistReports(reports);
  renderReportPanel();
}

function getOrder(id){ return orders.find(o => o.id === id); }

function field(o, key, label, type){
  type = type || 'text';
  const val = (o[key] || '').toString().replace(/"/g,'&quot;');
  return `<div class="field"><label>${label}</label><input type="${type}" data-field="${key}" value="${val}" ${o.deleted?'disabled':''}></div>`;
}

function findDuplicateOrderNo(o){
  const val = (o.orderNo || '').trim().toLowerCase();
  if (!val) return null;
  return orders.find(other => other.id !== o.id && !other.deleted && (other.orderNo||'').trim().toLowerCase() === val) || null;
}

function updateOrderNoWarning(o){
  const warnEl = document.getElementById('orderNoWarning');
  if (!warnEl) return;
  const dup = findDuplicateOrderNo(o);
  if (dup){
    const stageLabel = (STAGES.find(s=>s.id===dup.stage)||{}).label || dup.stage;
    warnEl.style.display = 'block';
    warnEl.textContent = `⚠ Order No. "${o.orderNo}" already exists on ${dup.id} (${dup.customer||'—'} · ${stageLabel}) — check this isn't a duplicate entry.`;
  } else {
    warnEl.style.display = 'none';
    warnEl.textContent = '';
  }
}

function renderModal(){
  const o = getOrder(activeOrderId);
  if (!o) return;
  const stageInfo = STAGES.find(s => s.id === o.stage);
  const modal = document.getElementById('modal');
  modal.innerHTML = `
    <div class="modal-head">
      <div>
        <div class="ttl">${o.orderNo || '(no order no.)'} — ${o.customer || 'Unnamed customer'}</div>
        <div class="sub">${o.id} · Stage: ${stageInfo.label}${hasFail(o) ? ' · HOLD' : ''}${isOverdue(o) ? ' · OVERDUE' : ''}${o.deleted ? ' · DELETED' : ''}</div>
      </div>
      <button onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">

      <div class="section">
        <h4>Order Details <span class="role-tag">For Customer Service only</span></h4>
        <div class="grid">
          ${field(o,'customer','Customer')}
          ${field(o,'orderNo','Order / Shipment No.')}
          ${field(o,'destination','Destination')}
          ${field(o,'carrier','Carrier / Haulier')}
          ${field(o,'collectionRef','Collection Reference')}
          ${field(o,'requestedCollection','Requested Collection','datetime-local')}
          <div class="field"><label>Priority</label>
            <select data-field="priority" ${o.deleted?'disabled':''}>
              <option value="normal" ${o.priority==='normal'?'selected':''}>Normal</option>
              <option value="urgent" ${o.priority==='urgent'?'selected':''}>Urgent</option>
            </select>
          </div>
          ${field(o,'expectedPallets','Expected Pallets','number')}
          ${field(o,'physicalPallets','Physical Pallets','number')}
          ${field(o,'palletLocation','Pallet Location / Staging Area')}
          ${field(o,'vehicleReg','Vehicle Registration')}
          ${field(o,'driver','Driver')}
        </div>
        <div id="orderNoWarning" class="dup-warning" style="display:none;"></div>
        <div class="field" style="margin-top:10px;"><label>Customer Service Notes</label>
          <textarea data-field="csNotes" rows="2" ${o.deleted?'disabled':''}>${(o.csNotes||'')}</textarea>
        </div>
        ${o.deleted ? `<div style="margin-top:10px; font-size:12px; color:var(--fail);">Deleted ${o.deletedAt ? new Date(o.deletedAt).toLocaleString() : ''} by ${o.deletedBy||''}${o.deleteReason ? ' — ' + o.deleteReason : ''}</div>` : ''}
      </div>

      <div class="section">
        <h4>Stage Sign-off <span class="role-tag">For Team Leaders to action</span> <span style="font-weight:400; text-transform:none; letter-spacing:0;">(auto-stamped, not editable)</span></h4>
        <table class="checks">
          <tr><th>Stage</th><th>By</th><th>When</th></tr>
          ${STAGES.map(s => {
            const stamp = o.stageStamps[s.id];
            return `<tr><td class="chk-label">${s.label}</td><td>${stamp ? stamp.by : '—'}</td><td>${stamp ? new Date(stamp.at).toLocaleString([], {day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}) : '—'}</td></tr>`;
          }).join('')}
        </table>
      </div>

      <div class="section">
        <h4>Release Checks <span class="role-tag">Team Leader check only</span></h4>
        <table class="checks">
          <tr><th style="width:22%">Check</th><th style="width:35%">Requirement</th><th style="width:20%">Status</th><th>Comment</th></tr>
          ${CHECK_ROWS.map(r => `
            <tr>
              <td class="chk-label">${r.label}</td>
              <td class="chk-req">${r.req}</td>
              <td>
                <div class="seg" data-row="${r.k}">
                  <button type="button" data-v="PASS" class="${o.checks[r.k].status==='PASS'?'active':''}" ${o.deleted?'disabled':''}>PASS</button>
                  <button type="button" data-v="FAIL" class="${o.checks[r.k].status==='FAIL'?'active':''}" ${o.deleted?'disabled':''}>FAIL</button>
                  ${r.naAllowed ? `<button type="button" data-v="N/A" class="${o.checks[r.k].status==='N/A'?'active':''}" ${o.deleted?'disabled':''}>N/A</button>` : ''}
                </div>
              </td>
              <td><input class="comment-input" data-comment="${r.k}" value="${(o.checks[r.k].comment||'').replace(/"/g,'&quot;')}" ${o.deleted?'disabled':''} style="width:100%;font-size:11.5px;padding:4px 6px;border:1px solid var(--line);border-radius:4px;"></td>
            </tr>
          `).join('')}
        </table>
      </div>

      <div class="section">
        <h4>Photos (pallet / label / loading evidence) <span class="role-tag">Team Leader &amp; Forklift Driver</span></h4>
        <div class="photo-grid" id="photoGrid">
          ${o.photos.map((p,i) => `<img src="${p.dataUrl}" onclick="viewPhoto(${i})" title="${p.caption||''}">`).join('')}
          ${o.deleted ? '' : '<div class="photo-add" onclick="openCamera()" title="Take photo">📷</div>'}
        </div>
        ${o.deleted ? '' : `<div class="photo-alt">or <span class="linklike" onclick="document.getElementById('photoFileInput').click()">upload from files</span>
          <input type="file" id="photoFileInput" accept="image/*" multiple style="display:none;" onchange="addPhotos(event)"></div>`}
      </div>

      <div class="section">
        <h4>Activity Log</h4>
        <div class="log">
          ${o.activity.slice().reverse().map(a => `
            <div class="log-entry"><span class="when">${new Date(a.at).toLocaleString([], {day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})}</span>
            <span class="who">${a.by}</span> — ${a.action}${a.note ? ': ' + a.note : ''}</div>
          `).join('') || '<div class="empty-col">No activity yet</div>'}
        </div>
        <div class="add-note">
          <input id="noteInput" placeholder="Add a note…">
          <button class="btn ghost sm" onclick="addNote()">Add Note</button>
        </div>
      </div>

    </div>
    <div class="modal-actions">
      ${o.deleted ? `
        <div class="left"><span style="font-size:12px;color:var(--muted);">This order is deleted and locked. Restore it to resume working on it.</span></div>
        <button class="btn ghost sm" onclick="restoreOrder()">↺ Restore Order</button>
      ` : `
        <div class="left">
          ${stageInfo.next ? `
            <button class="btn ghost sm" onclick="regressStage()" ${o.stage===STAGES[0].id?'disabled':''}>◀ Send Back</button>
            <button class="btn primary sm" onclick="advanceStage()">${stageInfo.nextLabel} ▶</button>
            ${hasFail(o) ? '<button class="btn danger sm" onclick="managerOverrideAdvance()">🔒 Manager Override</button>' : ''}
          ` : `<span style="font-size:12px;color:var(--muted);">Dispatched ${o.dispatchedAt ? new Date(o.dispatchedAt).toLocaleString() : ''}</span>`}
          <button class="btn ghost sm" onclick="printCollectionNote()">🖨 Collection Note</button>
        </div>
        <button class="btn danger sm" onclick="deleteOrder()">Delete Order</button>
      `}
    </div>
  `;

  modal.querySelectorAll('[data-field]').forEach(el => {
    el.addEventListener('change', e => {
      o[e.target.dataset.field] = e.target.value;
      persistOrders();
      renderSummary();
      if (e.target.dataset.field === 'orderNo') updateOrderNoWarning(o);
    });
  });
  const orderNoInput = modal.querySelector('[data-field="orderNo"]');
  if (orderNoInput) orderNoInput.addEventListener('input', () => updateOrderNoWarning(o));
  updateOrderNoWarning(o);
  modal.querySelectorAll('.seg').forEach(seg => {
    const key = seg.dataset.row;
    seg.querySelectorAll('button').forEach(btn => {
      btn.addEventListener('click', () => {
        o.checks[key].status = (o.checks[key].status === btn.dataset.v) ? null : btn.dataset.v;
        persistOrders();
        renderModal();
      });
    });
  });
  modal.querySelectorAll('[data-comment]').forEach(inp => {
    inp.addEventListener('input', e => { o.checks[e.target.dataset.comment].comment = e.target.value; persistOrders(); });
  });
}

function addNote(){
  const o = getOrder(activeOrderId);
  const input = document.getElementById('noteInput');
  if (!input.value.trim()) return;
  logActivity(o, 'Note added', input.value.trim());
  persistOrders();
  renderModal();
}

function advanceStage(overrideReason){
  const o = getOrder(activeOrderId);
  const stageInfo = STAGES.find(s => s.id === o.stage);
  if (!stageInfo.next) return;
  if (!overrideReason && (stageInfo.next === 'ready' || stageInfo.next === 'dispatched') && hasFail(o)){
    alert('This order has a FAILED check. Resolve it, or use Manager Override, before moving it forward — it must not be loaded or released on HOLD.');
    return;
  }
  if (stageInfo.next === 'dispatched' && o.photos.length === 0){
    alert('At least one photo (pallet, label or loading evidence) is required before an order can be marked Dispatched.');
    return;
  }
  const fromLabel = stageInfo.label;
  const timeInStage = formatDuration(Date.now() - new Date(o.stageEnteredAt).getTime());
  o.stage = stageInfo.next;
  const now = new Date().toISOString();
  o.stageStamps[o.stage] = {by: whoami(), at: now};
  o.stageEnteredAt = now;
  if (o.stage === 'dispatched') o.dispatchedAt = now;
  if (overrideReason){
    const failedLabels = CHECK_ROWS.filter(r => o.checks[r.k].status === 'FAIL').map(r => r.label).join(', ') || 'none';
    logActivity(o, 'MANAGER OVERRIDE', `Released past failed check(s) [${failedLabels}]. ${fromLabel} → ${STAGES.find(s=>s.id===o.stage).label} (spent ${timeInStage} in ${fromLabel}). Reason: ${overrideReason}`);
  } else {
    logActivity(o, 'Stage moved', `${fromLabel} → ${STAGES.find(s=>s.id===o.stage).label} (spent ${timeInStage} in ${fromLabel})`);
  }
  persistOrders();
  renderModal();
  renderAll();
}

function managerOverrideAdvance(){
  const o = getOrder(activeOrderId);
  if (!o || !hasFail(o)){ alert('No failed checks on this order — no override needed.'); return; }
  const pin = prompt('Enter manager PIN to override the failed check(s) and release this order:');
  if (pin === null) return;
  if (pin !== getManagerPin()){ alert('Incorrect PIN.'); return; }
  const reason = prompt('Reason for overriding the failed check(s) (required for the audit log):');
  if (reason === null || !reason.trim()){ alert('A reason is required to log the override.'); return; }
  advanceStage(reason.trim());
}

function regressStage(){
  const o = getOrder(activeOrderId);
  const idx = STAGES.findIndex(s => s.id === o.stage);
  if (idx <= 0) return;
  const fromLabel = STAGES[idx].label;
  const timeInStage = formatDuration(Date.now() - new Date(o.stageEnteredAt).getTime());
  o.stage = STAGES[idx-1].id;
  o.stageEnteredAt = new Date().toISOString();
  delete o.stageStamps[STAGES[idx].id];
  logActivity(o, 'Stage sent back', `${fromLabel} → ${STAGES[idx-1].label} (spent ${timeInStage} in ${fromLabel})`);
  persistOrders();
  renderModal();
  renderAll();
}

function exportBackup(){
  const payload = {
    exportedAt: new Date().toISOString(),
    orders,
    reports: loadReports(),
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const stamp = new Date().toISOString().slice(0,19).replace(/[:T]/g,'-');
  a.href = url;
  a.download = `outbound-order-tracker-backup-${stamp}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function importBackup(event){
  const file = event.target.files && event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    let payload;
    try{ payload = JSON.parse(e.target.result); }
    catch(err){ alert('That file isn\'t a valid backup — could not be read as JSON.'); event.target.value = ''; return; }
    const incoming = Array.isArray(payload) ? payload : payload.orders;
    if (!Array.isArray(incoming)){ alert('That file doesn\'t look like a valid backup.'); event.target.value = ''; return; }
    if (!confirm(`This will restore ${incoming.length} order(s) from the backup file into the live board. Orders already on the board keep their current data unless the backup overwrites the same ID. Continue?`)) { event.target.value = ''; return; }
    backfillOrders(incoming);
    incoming.forEach(o => {
      const idx = orders.findIndex(x => x.id === o.id);
      if (idx >= 0) orders[idx] = o; else orders.push(o);
    });
    persistOrders();
    if (payload.reports && Array.isArray(payload.reports)) persistReports(payload.reports);
    event.target.value = '';
    renderAll();
    alert('Backup restored.');
  };
  reader.readAsText(file);
}

let cameraStream = null;
let cameraSessionCount = 0;

async function openCamera(){
  const o = getOrder(activeOrderId);
  if (!o || o.deleted) return;
  document.getElementById('camOrderLabel').textContent = o.orderNo || o.id;
  const errEl = document.getElementById('camError');
  errEl.style.display = 'none';
  document.getElementById('camThumbs').innerHTML = '';
  cameraSessionCount = 0;
  document.getElementById('camCount').textContent = '0 captured';
  document.getElementById('camOverlay').classList.add('open');

  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    errEl.style.display = 'flex';
    errEl.innerHTML = 'Camera capture isn\'t supported on this browser.<br>Close this and use "upload from files" instead.';
    return;
  }
  try{
    cameraStream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}, audio:false});
    document.getElementById('camVideo').srcObject = cameraStream;
  }catch(err){
    errEl.style.display = 'flex';
    errEl.innerHTML = 'Camera not available — check permissions.<br>Close this and use "upload from files" instead.';
  }
}

function captureCameraPhoto(){
  const o = getOrder(activeOrderId);
  const video = document.getElementById('camVideo');
  if (!o || !cameraStream || !video.videoWidth) return;
  const maxW = 900;
  const scale = Math.min(1, maxW / video.videoWidth);
  const canvas = document.createElement('canvas');
  canvas.width = video.videoWidth * scale;
  canvas.height = video.videoHeight * scale;
  canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
  const dataUrl = canvas.toDataURL('image/jpeg', 0.72);

  o.photos.push({dataUrl, caption:'', by:whoami(), at:new Date().toISOString()});
  persistOrders();

  cameraSessionCount++;
  document.getElementById('camCount').textContent = cameraSessionCount + ' captured';
  const thumbs = document.getElementById('camThumbs');
  const img = document.createElement('img');
  img.src = dataUrl;
  thumbs.appendChild(img);
  thumbs.scrollLeft = thumbs.scrollWidth;

  const flash = document.getElementById('camFlash');
  flash.classList.remove('flash');
  void flash.offsetWidth;
  flash.classList.add('flash');
}

function closeCamera(){
  document.getElementById('camOverlay').classList.remove('open');
  if (cameraStream){
    cameraStream.getTracks().forEach(t => t.stop());
    cameraStream = null;
  }
  const o = getOrder(activeOrderId);
  if (o && cameraSessionCount > 0){
    logActivity(o, 'Photo(s) added', `${cameraSessionCount} photo(s) via camera`);
    persistOrders();
  }
  renderModal();
  renderAll();
}

function addPhotos(event){
  const o = getOrder(activeOrderId);
  const files = Array.from(event.target.files || []);
  let remaining = files.length;
  if (!remaining) return;
  files.forEach(file => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        const maxW = 900;
        const scale = Math.min(1, maxW / img.width);
        const canvas = document.createElement('canvas');
        canvas.width = img.width * scale;
        canvas.height = img.height * scale;
        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
        const dataUrl = canvas.toDataURL('image/jpeg', 0.72);
        o.photos.push({dataUrl, caption:'', by:whoami(), at:new Date().toISOString()});
        remaining--;
        if (remaining === 0){
          logActivity(o, 'Photo(s) added', `${files.length} photo(s) via file upload`);
          persistOrders();
          renderModal();
        }
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

function deleteOrder(){
  const o = getOrder(activeOrderId);
  if (!confirm('Delete this order? It will come off the board but stay fully on record under History → Deleted, with a timestamp and who deleted it.')) return;
  const reason = prompt('Reason for deleting this order (optional):') || '';
  o.deleted = true;
  o.deletedAt = new Date().toISOString();
  o.deletedBy = whoami();
  o.deleteReason = reason;
  logActivity(o, 'Order deleted', reason);
  persistOrders();
  closeModal();
}

function restoreOrder(){
  const o = getOrder(activeOrderId);
  if (!confirm('Restore this order back onto the board?')) return;
  o.deleted = false;
  logActivity(o, 'Order restored', '');
  persistOrders();
  renderModal();
  renderAll();
}

let historyView = 'dispatched';

function setHistoryView(v){
  historyView = v;
  document.getElementById('histTabDispatched').classList.toggle('active', v === 'dispatched');
  document.getElementById('histTabDeleted').classList.toggle('active', v === 'deleted');
  document.getElementById('histSearch').placeholder = v === 'deleted'
    ? 'Search deleted orders by customer, order no., carrier…'
    : 'Search dispatched orders by customer, order no., carrier…';
  renderHistory();
}

function renderHistory(){
  const q = (document.getElementById('histSearch').value || '').toLowerCase();
  const wrap = document.getElementById('histWrap');

  if (historyView === 'deleted'){
    const deleted = orders.filter(o => o.deleted)
      .filter(o => !q || [o.id,o.customer,o.orderNo,o.carrier].join(' ').toLowerCase().includes(q))
      .sort((a,b) => (b.deletedAt||'').localeCompare(a.deletedAt||''));
    if (!deleted.length){
      wrap.innerHTML = '<div class="empty">No deleted orders.</div>';
      return;
    }
    wrap.innerHTML = `
      <table class="hist">
        <tr><th>Order ID</th><th>Customer</th><th>Order No.</th><th>Carrier</th><th>Stage at Deletion</th><th>Deleted</th><th>Deleted By</th><th>Reason</th></tr>
        ${deleted.map(o => `
          <tr onclick="openOrder('${o.id}')">
            <td>${o.id}</td><td>${o.customer||''}</td><td>${o.orderNo||''}</td><td>${o.carrier||''}</td>
            <td>${(STAGES.find(s=>s.id===o.stage)||{}).label || o.stage}</td>
            <td>${o.deletedAt ? new Date(o.deletedAt).toLocaleString([], {day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}) : ''}</td>
            <td>${o.deletedBy||''}</td>
            <td>${o.deleteReason||''}</td>
          </tr>
        `).join('')}
      </table>`;
    return;
  }

  const dispatched = orders.filter(o => o.stage === 'dispatched' && !o.deleted)
    .filter(o => !q || [o.id,o.customer,o.orderNo,o.carrier].join(' ').toLowerCase().includes(q))
    .sort((a,b) => (b.dispatchedAt||'').localeCompare(a.dispatchedAt||''));
  if (!dispatched.length){
    wrap.innerHTML = '<div class="empty">No dispatched orders yet.</div>';
    return;
  }
  wrap.innerHTML = `
    <table class="hist">
      <tr><th>Order ID</th><th>Customer</th><th>Order No.</th><th>Carrier</th><th>Pallets</th><th>Dispatched</th><th>Photos</th><th>Status</th></tr>
      ${dispatched.map(o => `
        <tr onclick="openOrder('${o.id}')">
          <td>${o.id}</td><td>${o.customer||''}</td><td>${o.orderNo||''}</td><td>${o.carrier||''}</td>
          <td>${o.physicalPallets||o.expectedPallets||''}</td>
          <td>${o.dispatchedAt ? new Date(o.dispatchedAt).toLocaleString([], {day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}) : ''}</td>
          <td>${o.photos.length}</td>
          <td>${hasFail(o) ? 'HAD HOLD' : 'CLEAN'}</td>
        </tr>
      `).join('')}
    </table>`;
}

function showView(v){
  document.getElementById('view-board').classList.toggle('active', v==='board');
  document.getElementById('view-history').classList.toggle('active', v==='history');
  document.getElementById('tabBoardBtn').classList.toggle('active', v==='board');
  document.getElementById('tabHistBtn').classList.toggle('active', v==='history');
  if (v === 'history') renderHistory();
}

function renderAll(){ renderSummary(); renderBoard(); }

function updateClock(){
  const now = new Date();
  const timeEl = document.getElementById('clockTime');
  const dateEl = document.getElementById('clockDate');
  if (timeEl) timeEl.textContent = now.toLocaleTimeString('en-GB', {hour:'2-digit', minute:'2-digit', second:'2-digit'});
  if (dateEl) dateEl.textContent = now.toLocaleDateString('en-GB', {weekday:'short', day:'2-digit', month:'short', year:'numeric'});

  if (!document.fullscreenElement) document.body.classList.remove('wallboard');

// Live sync across every device/browser connected to this board — powered by
// Supabase Realtime. When anyone anywhere saves a change, everyone else's
// screen (including a TV in Wall Board mode) updates within a second or two.
function subscribeRealtime(){
  if (!sb) return;
  sb.channel('oot-orders-changes')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'oot_orders' }, payload => {
      if (payload.eventType === 'DELETE'){
        const deadId = payload.old && payload.old.id;
        if (deadId === activeOrderId) return; // don't yank the rug out from under an open edit
        orders = orders.filter(o => o.id !== deadId);
        renderAll();
        return;
      }
      const incoming = payload.new.data;
      const suppressUntil = recentlySavedUntil[incoming.id] || 0;
      if (incoming.id === activeOrderId || Date.now() < suppressUntil){
        return; // ignore — either we're actively editing this order, or this is an echo of our own recent save
      }
      backfillOrders([incoming]);
      const idx = orders.findIndex(o => o.id === incoming.id);
      if (idx >= 0) orders[idx] = incoming; else orders.push(incoming);
      renderAll();
    })
    .subscribe();

  sb.channel('oot-reports-changes')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'oot_reports' }, payload => {
      if (payload.eventType === 'DELETE'){
        reports = reports.filter(r => r.id !== (payload.old && payload.old.id));
      } else {
        const incoming = payload.new.data;
        const idx = reports.findIndex(r => r.id === incoming.id);
        if (idx >= 0) reports[idx] = incoming; else reports.push(incoming);
      }
      if (document.getElementById('reportOverlay').classList.contains('open')) renderReportPanel();
    })
    .subscribe();
}

// init
async function init(){
  document.getElementById('whoami').value = localStorage.getItem(WHOAMI_KEY) || '';
  updateClock();
  setInterval(updateClock, 1000);

  if (!sb){
    document.getElementById('boardGrid').innerHTML =
      '<div class="empty" style="grid-column:1/-1;">This copy of the tool isn\'t connected to a database yet — SUPABASE_URL / SUPABASE_ANON_KEY need to be set near the top of the &lt;script&gt; block. Until then nothing will save or sync.</div>';
    return;
  }

  orders = await fetchOrdersFromServer();
  reports = await fetchReportsFromServer();
  renderAll();
  subscribeRealtime();
  setInterval(renderAll, 30000);
}
init();
